[project]
name = "vijil-pagerduty"
version = "0.1.0"
description = "Send Vijil Dome blocks and Diamond findings to PagerDuty as incidents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vijil-pagerduty = "vijil_pagerduty.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
